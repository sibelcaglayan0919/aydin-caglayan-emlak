<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Danışman Paneli | Aydın Çağlayan Emlak</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: var(--space-6, 2rem) var(--space-4, 1rem);
  }
  .admin-wrap { max-width: 860px; margin: 0 auto; }
  .admin-wrap h1 { font-family: var(--font-heading); color: var(--text); margin-bottom: 1.5rem; }
  .admin-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    margin-bottom: 1.5rem;
  }
  .admin-field { margin-bottom: 1rem; }
  .admin-field label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; color: var(--text-muted); }
  .admin-field input[type="text"],
  .admin-field input[type="number"],
  .admin-field input[type="password"],
  .admin-field input[type="url"],
  .admin-field select,
  .admin-field textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.95rem;
  }
  .admin-field input:focus,
  .admin-field select:focus,
  .admin-field textarea:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  .admin-field textarea { min-height: 5rem; resize: vertical; }
  .admin-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .admin-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .admin-row, .admin-row-3 { grid-template-columns: 1fr; } }
  .admin-checkbox { display: flex; align-items: center; gap: 0.5rem; }
  .admin-checkbox input { width: auto; }
  .admin-btn {
    background: var(--gold);
    color: var(--gold-ink);
    border: none;
    border-radius: var(--radius);
    padding: 0.7rem 1.4rem;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .admin-btn:hover { opacity: 0.9; }
  .admin-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .admin-btn--secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .admin-btn--sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
  .admin-btn--danger { background: transparent; color: #E0665C; border: 1px solid #E0665C; }
  .admin-row-actions { display: flex; gap: 0.5rem; }
  .admin-status { min-height: 1.3rem; margin-top: 0.5rem; font-size: 0.9rem; }
  .admin-status--ok { color: var(--wa); }
  .admin-status--error { color: #E0665C; }
  .admin-table { width: 100%; border-collapse: collapse; }
  .admin-table th, .admin-table td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  #photo-preview { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  #photo-preview img { width: 84px; height: 63px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); }
  .admin-form-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="admin-wrap">
  <h1>Danışman Paneli</h1>

  <section id="admin-login" class="admin-card">
    <h2>Giriş Yap</h2>
    <form id="login-form" novalidate>
      <div class="admin-field">
        <label for="login-username">Kullanıcı adı</label>
        <input type="text" id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="admin-field">
        <label for="login-password">Şifre</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="admin-btn">Giriş Yap</button>
      <div id="login-status" class="admin-status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="admin-panel" hidden>
    <div class="admin-header">
      <h2>İlanlar</h2>
      <button type="button" id="logout-btn" class="admin-btn admin-btn--secondary">Çıkış Yap</button>
    </div>

    <div class="admin-card">
      <table class="admin-table">
        <thead><tr><th>Başlık</th><th>Fiyat</th><th>Durum</th><th>İşlem</th></tr></thead>
        <tbody id="listings-tbody"></tbody>
      </table>
      <div id="list-status" class="admin-status" role="status" aria-live="polite"></div>
    </div>

    <div class="admin-card">
      <h2 id="form-title">Yeni İlan Ekle</h2>
      <form id="listing-form" novalidate>
        <div class="admin-field">
          <label for="field-id">İlan id (URL'de kullanılır — sadece küçük harf, rakam, tire)</label>
          <input type="text" id="field-id" placeholder="örn: villa-akbuk (boş bırakırsan başlıktan otomatik üretilir)">
        </div>

        <div class="admin-row">
          <div class="admin-field">
            <label for="field-title-tr">Başlık (TR)</label>
            <input type="text" id="field-title-tr" required>
          </div>
          <div class="admin-field">
            <label for="field-title-en">Başlık (EN)</label>
            <input type="text" id="field-title-en" required>
          </div>
        </div>

        <div class="admin-row">
          <div class="admin-field">
            <label for="field-desc-tr">Açıklama (TR)</label>
            <textarea id="field-desc-tr" required></textarea>
          </div>
          <div class="admin-field">
            <label for="field-desc-en">Açıklama (EN)</label>
            <textarea id="field-desc-en" required></textarea>
          </div>
        </div>

        <div class="admin-row-3">
          <div class="admin-field">
            <label for="field-price">Fiyat</label>
            <input type="number" id="field-price" min="0" step="1" required>
          </div>
          <div class="admin-field">
            <label for="field-currency">Para birimi</label>
            <input type="text" id="field-currency" value="TRY">
          </div>
          <div class="admin-field">
            <label for="field-status">Durum</label>
            <select id="field-status">
              <option value="sale">Satılık</option>
              <option value="rent">Kiralık</option>
              <option value="sold">Satıldı</option>
            </select>
          </div>
        </div>

        <div class="admin-row">
          <div class="admin-field">
            <label for="field-type">Tip</label>
            <select id="field-type">
              <option value="villa">Villa</option>
              <option value="daire">Daire</option>
              <option value="arsa">Arsa</option>
              <option value="isyeri">İşyeri</option>
            </select>
          </div>
          <div class="admin-field admin-checkbox">
            <input type="checkbox" id="field-featured">
            <label for="field-featured" style="margin:0;">Öne çıkan ilan</label>
          </div>
        </div>

        <div class="admin-row">
          <div class="admin-field">
            <label for="field-location-tr">Konum (TR)</label>
            <input type="text" id="field-location-tr" required>
          </div>
          <div class="admin-field">
            <label for="field-location-en">Konum (EN)</label>
            <input type="text" id="field-location-en" required>
          </div>
        </div>

        <div class="admin-row-3">
          <div class="admin-field">
            <label for="field-beds">Oda sayısı</label>
            <input type="number" id="field-beds" min="0" step="1" required>
          </div>
          <div class="admin-field">
            <label for="field-baths">Banyo</label>
            <input type="number" id="field-baths" min="0" step="1" required>
          </div>
          <div class="admin-field">
            <label for="field-area">m²</label>
            <input type="number" id="field-area" min="0" step="1" required>
          </div>
        </div>

        <h3>Yapı Bilgileri (opsiyonel)</h3>
        <div class="admin-row-3">
          <div class="admin-field">
            <label for="field-floor">Kat</label>
            <input type="number" id="field-floor" step="1">
          </div>
          <div class="admin-field">
            <label for="field-total-floors">Toplam kat</label>
            <input type="number" id="field-total-floors" step="1">
          </div>
          <div class="admin-field">
            <label for="field-building-age">Bina yaşı</label>
            <input type="number" id="field-building-age" step="1">
          </div>
        </div>
        <div class="admin-row">
          <div class="admin-field">
            <label for="field-facing">Cephe</label>
            <select id="field-facing"><option value="">Belirtilmedi</option></select>
          </div>
          <div class="admin-field">
            <label for="field-heating">Isıtma</label>
            <select id="field-heating"><option value="">Belirtilmedi</option></select>
          </div>
        </div>

        <div class="admin-field">
          <label for="photo-input">Fotoğraflar (yeni ilan için zorunlu; düzenlemede mevcutlara eklenir)</label>
          <input type="file" id="photo-input" accept="image/*" multiple>
          <div id="photo-preview"></div>
        </div>

        <div class="admin-form-actions">
          <button type="submit" id="form-submit" class="admin-btn">Kaydet</button>
          <button type="button" id="form-cancel" class="admin-btn admin-btn--secondary">Formu Temizle</button>
        </div>
        <div id="form-status" class="admin-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</div>
<script src="admin.js" defer></script>
</body>
</html>
